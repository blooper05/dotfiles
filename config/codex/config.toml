#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-astra"
model_reasoning_effort = "medium"
personality = "pragmatic"

notify = ["$CODEX_HOME/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[desktop]
followUpQueueMode = "queue"
git-worktree-root = "$XDG_STATE_HOME/codex/worktrees"
projectlessWorkspaceRoot = "$XDG_DATA_HOME/codex/tasks"
worktree-upstream-refresh-mode = "best-effort"

[features]
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
in_app_browser = false
plugins = false
workspace_dependencies = false

[marketplaces.openai-bundled]
source_type = "local"
source = "$CODEX_HOME/.tmp/bundled-marketplaces/openai-bundled"

[mcp_servers.cua_repl]
command = "/Applications/ChatGPT.app/Contents/MacOS/ChatGPT"
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true
